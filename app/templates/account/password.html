{% extends "base.html" %}
{% block body %}
<div class="sectit">{{ '처음 로그인 · 비밀번호 정하기' if forced else '비밀번호 바꾸기' }}</div>

{% if forced %}
<div class="banner">
  <div class="seal ic-svg">{{ icon('lock') }}</div>
  <div>
    <b>임시 비밀번호로 들어오셨습니다</b>
    <p>임시 비밀번호는 발급한 운영자도 알고 있습니다. 새 비밀번호를 정해야 다른 화면을 쓸 수 있습니다.</p>
  </div>
</div>
{% endif %}

<form method="post" action="/account/password">
  <div class="field">
    <label>지금 비밀번호{{ ' (임시 비밀번호)' if forced }}</label>
    <input type="password" name="current_password" required autocomplete="current-password">
  </div>
  <div class="field">
    <label>새 비밀번호 ({{ min_length }}자 이상)</label>
    <input type="password" name="new_password" required minlength="{{ min_length }}" autocomplete="new-password">
  </div>
  <div class="field">
    <label>새 비밀번호 확인</label>
    <input type="password" name="confirm_password" required minlength="{{ min_length }}" autocomplete="new-password">
  </div>
  <button class="btn" type="submit">{{ '비밀번호 정하고 시작하기' if forced else '비밀번호 바꾸기' }}</button>
</form>

{% if not forced %}
<a class="btn ghost" href="{{ home }}">돌아가기</a>
{% endif %}
{% endblock %}
